<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Confirmação — Santa Paciência</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/public-reservation.css?v=public-flow-20261001-2">
</head>
<body class="public-success-page">
  <div class="booking-page">
    <header class="booking-hero">
      <div class="brand-pill">Santa Paciência</div>
    </header>
    <main class="booking-card confirmation-card">
      <svg class="confirmation-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="2"/>
        <path d="m14 24 7 7 13-14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 id="confirmation-title" tabindex="-1">Confirmação</h1>
      <p id="confirmation-message">Depois de concluir o formulário, encontrará aqui a confirmação do envio.</p>
      <dl class="confirmation-details" id="confirmation-details" hidden>
        <div id="confirmation-reference-row" hidden><dt>Referência</dt><dd id="confirmation-reference"></dd></div>
        <div id="confirmation-total-row" hidden><dt>Total estimado</dt><dd id="confirmation-total"></dd></div>
      </dl>
      <a class="ghost-btn confirmation-return" id="confirmation-return" hidden>Corrigir dados do pré check-in</a>
      <p class="microcopy" id="confirmation-close" hidden>Pode fechar esta página.</p>
    </main>
  </div>
  <script src="/js/public-success.js?v=public-flow-20261001-2"></script>
</body>
</html>
