name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/src/package-lock.json
      - run: npm ci
        working-directory: backend/src
      - run: npm run check && npm test && npm run test:http && node scripts/check-v1-functional.cjs && node scripts/check-v1-security-email.cjs && node scripts/check-v1-accounts.cjs && node scripts/check-instance-restore.cjs && node scripts/check-performance.cjs
        working-directory: backend/src
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: backend/src
      # As bibliotecas do frontend vêm por CDN: o audit do backend não as vê.
      # frontend/package.json declara as versões exatas só para isto.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/src/package-lock.json
      - run: npm ci
        working-directory: backend/src
      - run: npx playwright install --with-deps chromium webkit
        working-directory: backend/src
      - run: npm run test:browser
        working-directory: backend/src
        env:
          BROWSER_ARTIFACTS_DIR: ${{ github.workspace }}/browser-artifacts
      - run: npm run test:mobile && BROWSER_ENGINE=webkit npm run test:mobile && node scripts/check-precheckin.cjs && node scripts/check-public-voucher.cjs && node scripts/check-payment-policy-browser.cjs && node scripts/check-wizard-voucher.cjs && BROWSER_ENGINE=webkit node scripts/check-wizard-voucher.cjs && node scripts/check-pwa-resilience.cjs && BROWSER_ENGINE=webkit node scripts/check-pwa-resilience.cjs && node scripts/check-vouchers.cjs && node scripts/check-calendar-mobile.cjs && node scripts/check-public-mobile.cjs && node scripts/check-stripe-browser.cjs && node scripts/check-frontend-modules.cjs && node scripts/check-notif-sound.cjs
        working-directory: backend/src
      - run: npm run measure:frontend
        working-directory: backend/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-synthetic-data
          path: browser-artifacts/
          if-no-files-found: ignore
